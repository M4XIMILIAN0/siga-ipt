events {}

http {
    # The 3 backend replicas (service names from docker-compose.yml)
    upstream siga_backend {
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
    }

    server {
        listen 80;

        # API -> one of the 3 replicas (round robin by default)
        location /api/ {
            proxy_pass http://siga_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Shows which replica answered (useful to demonstrate the load balancing)
            add_header X-Backend-Replica $upstream_addr always;
        }

        # Swagger is also served by the backend replicas
        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://siga_backend;
            proxy_set_header Host $host;
        }

        # Everything else -> the React app
        location / {
            proxy_pass http://frontend:80;
        }
    }
}