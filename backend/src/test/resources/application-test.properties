# Integration tests: in-memory H2 database (PostgreSQL mode). No Docker or Keycloak needed.
# NON_KEYWORDS: "day" is a reserved word in H2 (column of schedule_blocks)
spring.datasource.url=jdbc:h2:mem:siga_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=DAY,YEAR,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Any value works: jwt() in the tests skips the real token validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/siga-ipt
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8090/realms/siga-ipt/protocol/openid-connect/certs

# Load Appendix A + María, Juan and Pedro as base data
app.load-data=true