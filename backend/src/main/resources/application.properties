spring.application.name=siga-backend

# Database connection (values come from environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Keycloak: where the tokens come from (Spring downloads Keycloak's public keys from here)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Public keys of Keycloak (inside Docker: internal URL http://keycloak:8080/...)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}

# Only ONE replica loads Appendix A (default true for local development)
app.load-data=${APP_LOAD_DATA:true}