name: CI/CD - SIGA IPT

on:
  push:
    branches: [main]
  workflow_dispatch:   # also allows running it manually from the Actions tab

jobs:

  # ---------- Job 1: backend tests (unit + integration) ----------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests (service layer)
        run: ./mvnw -B test -Dtest='*ServiceTest'

      - name: Run integration tests
        run: ./mvnw -B test -Dtest='*IntegrationTest'

  # ---------- Job 2: build and push Docker images (ONLY if tests passed) ----------
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-frontend:${{ github.sha }}